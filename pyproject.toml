[project]
name = "faultprop"
version = "0.0.1"
description = "Fault propagation across multi-agent LLM topologies in a synthetic financial-service workflow"
requires-python = ">=3.11"
dependencies = [
  "strands-agents[ollama]>=1.54",
  "pydantic>=2",
  "pyyaml",
  "typer",
  "rich",
  "python-dotenv",
  "pandas",
]

[project.optional-dependencies]
analysis = ["jupyter", "matplotlib", "seaborn"]
dev = ["pytest", "ruff"]

[project.scripts]
faultprop = "faultprop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultprop"]

[tool.ruff]
line-length = 100
